sonar.projectKey=kotlin-android-test
sonar.projectName=Kotlin Android Test
sonar.projectVersion=1.0.0

# Source code
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java,app/src/androidTest/java

# Coverage (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# SCM
sonar.scm.provider=git

# Exclusions (generated files, UI components, theme)
sonar.exclusions=\
  app/build/**,\
  app/src/main/java/**/ui/theme/**,\
  app/src/main/java/**/MainActivity.kt,\
  **/*Test.kt,\
  **/*.gradle.kts,\
  gradle/**

# Test exclusions
sonar.test.exclusions=\
  app/src/androidTest/**,\
  **/ExampleInstrumentedTest.kt

# Encoding
sonar.sourceEncoding=UTF-8